<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Couldn’t Find That Page</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0a0f">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0a0a0f 0%, #161622 100%);
      color: #f0f0f5;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(26, 26, 38, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      color: #b9b9ca;
      line-height: 1.6;
      margin: 0 0 16px;
    }
    .path {
      color: #ff8c42;
      word-break: break-word;
      margin-bottom: 24px;
      display: block;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e8443a, #ff8c42);
      color: #fff;
    }
    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f0f0f5;
      background: rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>We couldn’t find that page.</h1>
    <p>The link may be outdated, the profile may not be public yet, or the address may have a typo.</p>
    <span class="path">{{ requested_path }}</span>
    <div class="actions">
      <a class="btn btn-primary" href="{{ home_url }}">Go Home</a>
      <a class="btn btn-secondary" href="{{ discover_url }}">Discover Editors</a>
    </div>
  </main>
</body>
</html>
