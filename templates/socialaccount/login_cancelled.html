{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Google Sign-In Cancelled" %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0f;
      --card: #16161f;
      --border: #2a2a3a;
      --text: #f0f0f5;
      --muted: #9898ae;
      --accent: #e8443a;
      --accent-soft: rgba(232, 68, 58, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, var(--accent-soft), transparent 34%),
        linear-gradient(180deg, #101019 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
    }

    .shell {
      width: min(100%, 560px);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(22, 22, 31, 0.94);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #ff8a82;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 6vw, 2.6rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: linear-gradient(135deg, #e8443a, #ff8c42);
      color: #fff;
    }

    .button-secondary {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">{% trans "Google sign-in" %}</div>
    <h1>{% trans "Sign-in was cancelled" %}</h1>
    <p>{% trans "Nothing was changed on your account. You can head back to the site and try again whenever you're ready." %}</p>
    <div class="actions">
      <a class="button button-primary" href="{% url 'portfolio:home' %}">{% trans "Back to home" %}</a>
      <a class="button button-secondary" href="{% url 'portfolio:dashboard' %}">{% trans "Open dashboard" %}</a>
    </div>
  </main>
</body>
</html>
